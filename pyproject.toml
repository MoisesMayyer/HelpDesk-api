[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic[email]>=2,<3",
    "pydantic-settings>=2,<3",
    "PyJWT>=2.10.1,<3",
    "PyMySQL[rsa]>=1.1,<2",
    "python-multipart>=0.0.22,<1",
    "slowapi>=0.1.9,<1",
    "SQLAlchemy>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
